<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Daily Bugle | Information Trust Engine</title>

  <link rel="stylesheet" href="/static/css/base.css" />
  <link rel="stylesheet" href="/static/css/wire.css" />

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>

  <header class="bugle-masthead">
    <div class="brand-wrapper">
      <a href="/" class="brand-title">The Daily Bugle</a>
      <span class="brand-subtitle">Civic Intelligence Network</span>
    </div>

    <div class="nav-cluster">
      <nav class="main-nav">
        <a href="/" class="active">The Wire</a>
        <a href="/report">Submit Scoop</a>
        <a href="/desk" id="desk-nav-link" style="display: none;">Editor Desk</a>
      </nav>
      <div id="auth-header-container">
        <a href="/login" class="btn-auth-action">Sign In</a>
      </div>
    </div>
  </header>

  <main class="page-container">

    <section class="page-hero">
      <h1>The Wire</h1>
      <p>Explainable, community-corroborated civic intelligence — every score shows its work.</p>
    </section>

    <section class="wire-toolbar">
      <div class="view-tabs">
        <button class="tab-btn active" onclick="switchFeedView('wire', this)">The Wire (Feed)</button>
        <button class="tab-btn" onclick="switchFeedView('radar', this)">The Radar (Civic Map)</button>
        <button class="tab-btn" onclick="switchFeedView('graveyard', this)">Busted Rumors</button>
      </div>

      <div class="search-cluster">
        <input type="text" id="feed-search" class="search-input" placeholder="Search incidents, categories..." oninput="renderFeedCards(currentIncidents)" />
      </div>

      <div class="jjj-toggle-wrapper">
        <label for="jjj-switch-input">J. Jonah Jameson Mode</label>
        <label class="switch">
          <input type="checkbox" id="jjj-switch-input" onchange="toggleJJJEditorial(this)" />
          <span class="slider"></span>
        </label>
      </div>
    </section>

    <section id="feed-grid" class="news-grid">
      <div class="skeleton" style="height: 220px;"></div>
      <div class="skeleton" style="height: 220px;"></div>
      <div class="skeleton" style="height: 220px;"></div>
    </section>

    <section id="map-viewport"></section>

  </main>

  <footer class="bugle-footer">
    <p>&copy; 2026 The Daily Bugle Intelligence Desk. Transforming civic noise into explainable truth.</p>
  </footer>

  <script src="/static/js/toast.js"></script>
  <script src="/static/js/auth.js"></script>
  <script src="/static/js/wire.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => initHeaderSession({ loginRedirect: "/" }));
  </script>
</body>
</html>
